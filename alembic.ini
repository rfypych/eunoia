[alembic]
script_location = alembic
# The URL is a placeholder on purpose: alembic/env.py overrides it
# from eunoia settings (env/defaults) on every run. Do not put a real
# URL here — a hardcoded URL in this file would silently win over
# settings for anyone running `alembic` without env.py (final review
# triage, Task 3).
# sqlalchemy.url = postgresql+psycopg://eunoia@localhost:5432/eunoia

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
