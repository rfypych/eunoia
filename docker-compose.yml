# Eunoia dev stack — Postgres 16 + pgvector.
# Local-dev only. Production runs the same image with real auth, not trust auth.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eunoia
      POSTGRES_DB: eunoia
      # Trust auth keeps the dev DATABASE_URL password-free (config rejects
      # passwords in DATABASE_URL). Never use this outside local dev.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eunoia -d eunoia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
