# CI (T1, Rea-standard): full suite from a clean checkout.
#
# The `test` job exercises the same one-command setup a developer
# runs locally (`bash scripts/setup_dev.sh`, which brings up
# Postgres 16 + pgvector via Docker Compose on the runner), then
# runs the full suite. The `no-db` job runs the tests that need no
# database, so a DB outage can never hide a pure-logic regression
# behind a wall of connection errors.
name: CI

on:
  push:
    branches: [main, rea-standard]
  pull_request:

jobs:
  test:
    name: full suite (Postgres 16 + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One-command dev setup
        run: bash scripts/setup_dev.sh
      - name: Full test suite
        run: .venv/bin/python -m pytest -q

  no-db:
    name: tests that need no database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (no DB)
        run: |
          python -m pip install -q -e ".[dev,server]"
          python -m compileall -q src scripts
      - name: Non-DB tests
        run: |
          python -m pytest -q \
            tests/test_config.py \
            tests/test_dedup.py \
            tests/test_dod.py \
            tests/test_probe.py \
            tests/test_ranking.py
