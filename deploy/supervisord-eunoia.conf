; Eunoia deployment units (Task 16) — example supervisord config.
;
; Copy to /etc/supervisor/conf.d/eunoia.conf (or the 0xrphy-box
; supervisord config dir) and adjust paths + DATABASE_URL. The poll
; loop is the only long-running process; KEV sync runs from cron
; (daily) because it is a one-shot, not a daemon.
;
; Do NOT run these against the dev database on a laptop: DATABASE_URL
; must point at the deployment Postgres (pgvector >= 0.7.0, see
; docs/runbook.md). The worker commits its own session per cycle.
; The poller needs no HackerOne token (Task 1: no_auth_ok).

[program:eunoia-poll-loop]
command=/home/user/eunoia/.venv/bin/python /home/user/eunoia/scripts/worker.py poll-loop --interval-minutes 15
directory=/home/user/eunoia
environment=DATABASE_URL="postgresql://eunoia@localhost/eunoia"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/eunoia/poll-loop.log
stderr_logfile=/var/log/eunoia/poll-loop.err.log

; KEV sync — cron, daily (not a supervised program):
;   0 3 * * * eunoia  DATABASE_URL=postgresql://eunoia@localhost/eunoia /home/user/eunoia/.venv/bin/python /home/user/eunoia/scripts/worker.py kev-sync >> /var/log/eunoia/kev-sync.log 2>&1
;
; DoD item 1 (spec §7.4) is only met after this poll loop has run 7
; days unattended with every disclosed Java/Spring report indexed
; <=1h from publication — see docs/runbooks/dod-checklist.md.
